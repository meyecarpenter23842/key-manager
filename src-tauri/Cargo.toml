[package]
name = "key-manager"
version = "0.1.1"
description = "Key Manager desktop administration application"
authors = ["Key Manager"]
edition = "2021"

[lib]
name = "key_manager_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
